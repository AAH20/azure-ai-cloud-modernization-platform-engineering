[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-ai-cloud-modernization-platform-engineering"
version = "0.1.0"
description = "Evidence-driven Azure modernization and AI platform engineering decision engine"
requires-python = ">=3.11"

[project.scripts]
modernization-factory = "modernization_factory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
